.monitor-search { font:inherit; padding:8px 12px; width:min(100%,340px); border-radius:8px; border:1px solid #dcebe4; margin-block:4px 12px; }
.monitor-table { overflow:auto; max-height:490px; border:1px solid #e0eae6; border-radius:10px; }
.monitor-table table { border-collapse:collapse; width:100%; font-size:13px; }
.monitor-table th,.monitor-table td { padding:9px 11px; text-align:start; border-bottom:1px solid #e3ece8; min-width:90px; }
.monitor-table th { position:sticky; top:0; background:#f0f8f4; z-index:1; }
.monitor-table td { max-width:320px; white-space:pre-wrap; overflow-wrap:anywhere; }
.monitor-pages { justify-content:center; margin-top:12px; }

@font-face{font-family:Anjoman;src:local('Anjoman-FaNum Regular'),local('AnjomanFaNum-Regular');font-weight:400 500;font-display:swap}
@font-face{font-family:Anjoman;src:local('Anjoman-FaNum Bold'),local('AnjomanFaNum-Bold');font-weight:600 900;font-display:swap}
html body,html body input,html body button,html body select,html body textarea{font-family:Anjoman,Vazirmatn,sans-serif}
.analysis-card{background:linear-gradient(135deg,#f2fcf6,#fff 68%);border:1px solid #d0eee0;padding:clamp(12px,3vw,24px);border-radius:18px;margin:14px 0}
.analysis-heading,.analysis-controls,.analysis-dates{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.analysis-heading h3{font-size:18px;color:#123e32;margin:0}
.analysis-heading p,.analysis-empty{font-size:13px;color:#46655c;margin:5px 0 10px}
.analysis-controls{justify-content:start}
.analysis-controls button,.analysis-controls select,.analysis-dates input{border:1px solid #b9e2d3;background:white;border-radius:9px;padding:6px 10px;color:#174b3d}
.analysis-controls button[aria-pressed=true],.category-item[aria-pressed=true]{background:#d8f7e8;border-color:#51b78e}
.analysis-dates{justify-content:start;padding:10px 0}
.analysis-dates label{display:flex;gap:6px;align-items:center;font-size:13px}
.analysis-dates input{max-width:135px}
.analysis-dates small{color:#674a17}
.category-layout.with-pie{display:grid;grid-template-columns:minmax(160px,250px) 1fr;align-items:start;gap:24px}
.chart-donut{margin:20px auto;display:grid;place-items:center;width:min(100%,220px);aspect-ratio:1;border-radius:50%}
.chart-donut>div{background:#fff;width:66%;aspect-ratio:1;border-radius:50%;display:grid;align-content:center;text-align:center;padding:12px}
.chart-donut strong,.sms-kpis strong{font-size:25px;color:#13493b}
.chart-donut span{font-size:12px}
.category-list{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:7px}
.category-item{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:start;border:1px solid #dcece5;background:#fff;border-radius:10px;padding:9px 12px;color:#123e32}
.category-item small{font-size:11px;color:#48675e}
.category-label{display:flex;gap:7px;align-items:center;font-size:13px}
.category-label i{width:10px;height:10px;border-radius:50%;flex:none}
.category-detail,.bar-track{grid-column:1/-1}
.bar-track{background:#e5f1eb;height:7px;border-radius:8px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:8px}
.sms-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.sms-kpis div{display:grid;gap:4px;background:#ddf8eb;border:1px solid #ccece1;padding:12px 16px;border-radius:13px}
.sms-kpis div+div{background:#eee8fb;border-color:#dfd7f6}
.sms-kpis small{font-size:11px}
.monitor-details{padding:10px 2px;color:#14624d;font-weight:700;cursor:pointer}
.monitor-details:not([open])+.monitor-raw{display:none}
@media(max-width:650px){.category-layout.with-pie{grid-template-columns:1fr}.chart-donut{width:162px;margin:8px auto}.analysis-heading{align-items:start}}
.visit-monitor .analysis-heading{margin-block:8px 12px}
.visit-monitor .analysis-card summary,.visit-bank summary{cursor:pointer;color:#14624d;font-weight:700}
.visit-monitor .analysis-card p{font-size:13px;color:#46655c;line-height:1.8}
.visit-bank,.visit-upload{padding:12px 0;border-bottom:1px solid #dcebe4}
.visit-upload label,.visit-upload small{display:block;margin-bottom:6px}
.visit-upload input{max-width:100%}

@font-face{font-family:Anjoman;src:url('./assets/anjoman-REGULAR.woff') format('woff');font-display:swap;font-weight:400}
@font-face{font-family:Anjoman;src:url('./assets/anjoman-BOLD.woff') format('woff');font-display:swap;font-weight:650 900}
body,.app,button,input,select,textarea{font-family:Anjoman,Vazirmatn,sans-serif}
body,.app{background:#edf2f3}
.topbar{border-top:5px solid #324e55}
.panel,.stats>div{border-radius:12px;box-shadow:0 2px 8px #233b4510}
.sheet-monitor{background:#f3f6f6}
.monitor-stats>div,.okr-tiles article,.visit-visuals article{border:1px solid #d9e4e4;background:white;border-radius:10px;padding:16px;box-shadow:0 2px 6px #233b4509}
.monitor-stats>div{align-items:flex-start;flex-direction:column;border-top:3px solid #098e84}
.monitor-stats strong,.okr-tiles strong{font-size:clamp(23px,2.2vw,32px);color:#203e44}
.okr-tiles,.visit-visuals{display:grid;gap:12px;margin:14px 0}
.okr-tiles{grid-template-columns:repeat(auto-fit,minmax(min(205px,100%),1fr))}
.okr-tiles article{display:flex;flex-direction:column;align-items:stretch;gap:5px}
.okr-tiles h3,.visit-visuals h3{font-size:14px;margin:0 0 10px;color:#25464b}
.okr-tiles strong{margin-top:auto}
.okr-tiles small,.okr-tiles span{font-size:12px;color:#50646b;text-align:start}
.okr-track,.day-bar>div{height:7px;border-radius:8px;background:#e6eeee;overflow:hidden}
.okr-track i,.day-bar i{display:block;height:100%;background:#00988b;border-radius:inherit}
.visit-visuals{grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr))}
.visit-mix{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.visit-ring{width:136px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.visit-ring>b{width:72%;aspect-ratio:1;border-radius:50%;background:white;display:grid;align-content:center;text-align:center;font-size:27px}
.visit-ring small{font-size:12px}.visit-mix ul{list-style:none;flex:1;min-width:115px;padding:0}.visit-mix li{display:flex;align-items:center;gap:6px;padding:4px 0}.visit-mix li i{width:9px;height:9px;border-radius:50%}.visit-mix li b{margin-inline-start:auto}
.day-bar{display:grid;grid-template-columns:85px 1fr 36px;gap:10px;align-items:center;font-size:12px;margin:6px 0}
.overview-reports{margin-block:20px 28px}
.overview-reports>section{margin-block-end:24px}
.overview-reports header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.overview-reports header h2{display:flex;align-items:center;gap:8px;font-size:18px;margin:0;color:#193f43}
.overview-reports header small{color:#516970;font-size:12px}
.overview-reports .okr-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:850px){.overview-reports .okr-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.overview-reports .okr-tiles{grid-template-columns:1fr}}

/* Report navigation */
.sheet-monitor .monitor-tabs{gap:8px;padding:10px clamp(12px,2vw,24px) 14px}
.sheet-monitor .monitor-tabs button{cursor:pointer;min-height:42px;padding:7px 16px;border:1px solid #819c98;border-radius:9px;background:#fff;color:#284b49;font-size:14px;font-weight:650;box-shadow:0 1px 2px #203e4414}
.sheet-monitor .monitor-tabs button:hover{background:#e7f5f1;border-color:#177367}
.sheet-monitor .monitor-tabs button.active{background:#076557;border-color:#076557;color:white;box-shadow:inset 0 -3px #034a40}
.sheet-monitor .monitor-sources button{min-height:38px;font-size:13px;border-radius:7px}
.sheet-monitor .monitor-sources button.active{background:#d6efe7;color:#074c40;border-color:#167865;box-shadow:inset 0 -3px #167865}
.sheet-monitor .monitor-tabs button:focus-visible{outline:3px solid #156394;outline-offset:2px}
